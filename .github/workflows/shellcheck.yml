name: shellcheck

# O revisor que nunca dorme. Este repositório é ~3.000 linhas de bash que
# rodam com sudo numa máquina de trabalho de advogado — um typo em nome de
# variável não pode chegar ao usuário final.
#
# Severidade: -S warning. É o nível que os scripts passam limpos hoje
# (verificado em 09/09/2026). Não subimos para 'style'/'info' porque o
# SC2059 (variável de cor dentro do formato do printf) é intencional e
# generalizado no repo — os códigos ANSI ficam em constantes readonly.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -q shellcheck

      - name: Versão do shellcheck
        run: shellcheck --version

      - name: Analisar os scripts
        run: |
          shellcheck -S warning \
            instalar.sh \
            instalar-arch.sh \
            desinstalar.sh \
            desinstalar-arch.sh \
            atualizar-hashes.sh \
            lib/detectar-certificado.sh \
            lib/detectar-distro.sh

      - name: Conferir sintaxe (bash -n)
        run: |
          for f in *.sh lib/*.sh; do
            bash -n "$f" || exit 1
          done
